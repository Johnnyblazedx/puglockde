<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deadlock Turnier</title>
  <meta name="description" content="Deadlock Turnier für die DACH-Community – Freitag 06.11.26, 19 Uhr, live auf Twitch.">
  <meta property="og:title" content="Deadlock Turnier – Freitag 06.11.26, 19 Uhr">
  <meta property="og:description" content="Vier Teams aus der DACH-Community, live auf Twitch.">
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="../../assets/fonts/BarlowCondensed-Black.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
  <header class="kopf">
    <div class="wrap">
      <a class="marke" href="../../">Deadlock <span>PUG</span></a>
      <nav aria-label="Abschnitte">
        <a class="optional" href="#videos-block">Video</a>
        <a href="#anmeldung">Anmeldung</a>
        <a class="optional" href="#ablauf-block">Ablauf</a>
        <a href="#baum-block">Turnierbaum</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <p class="eyebrow">Community-Turnier</p>
        <h1 id="t-name">Deadlock Turnier<span class="zeile2">Live auf Twitch</span></h1>
        <div class="flaggen" aria-label="Deutschland, Österreich, Schweiz">
          <svg viewBox="0 0 5 3" role="img" aria-label="Deutschland"><rect width="5" height="1" fill="#000"/><rect y="1" width="5" height="1" fill="#DD0000"/><rect y="2" width="5" height="1" fill="#FFCE00"/></svg>
          <svg viewBox="0 0 3 2" role="img" aria-label="Österreich"><rect width="3" height="2" fill="#C8102E"/><rect y=".667" width="3" height=".667" fill="#fff"/></svg>
          <svg viewBox="0 0 32 32" role="img" aria-label="Schweiz" style="width:36px"><rect width="32" height="32" fill="#DA291C"/><path fill="#fff" d="M13 6h6v7h7v6h-7v7h-6v-7H6v-6h7z"/></svg>
        </div>
        <dl class="fakten" id="fakten"></dl>
        <div class="countdown" id="countdown" aria-live="off"></div>
        <div class="aktionen" id="aktionen"></div>
      </div>
    </section>

    <section class="block" id="videos-block">
      <div class="wrap">
        <h2>Ankündigung</h2>
        <div class="videos" id="videos"></div>
      </div>
    </section>

    <section class="block" id="anmeldung">
      <div class="wrap">
        <h2>Anmeldung</h2>
        <div id="anmeldung-infos"></div>
      </div>
    </section>

    <section class="block" id="ablauf-block">
      <div class="wrap">
        <h2>Ablauf</h2>
        <div id="ablauf"></div>
      </div>
    </section>

    <section class="block" id="baum-block">
      <div class="wrap">
        <h2>Turnierbaum</h2>
        <div class="baum" id="baum"></div>
        <div class="teams" id="teams"></div>
      </div>
    </section>
  </main>

  <footer class="fuss">
    <div class="wrap">
      <span>© <span id="jahr"></span> Deadlock PUG · Community-Projekt, nicht mit Valve verbunden.</span>
      <a href="../../">Alle Projekte</a>
    </div>
  </footer>

  <script src="daten.js"></script>
  <script src="../../assets/js/seite.js"></script>
</body>
</html>
